<!DOCTYPE html>

<head>

  <title>計劃流程 | 銳鋒顧問 Top Market</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; }
    body { background:#f8f9fc; color:#1a1e2b; line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
    .brand-logo { position:fixed; top:20px; left:24px; z-index:1000; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.78); backdrop-filter:blur(22px); padding:12px 24px; border-radius:50px; border:1.5px solid rgba(201,168,44,0.35); }
    .brand-logo h1 { font-size:2rem; font-weight:800; color:#1a1e2b; display:flex; align-items:center; gap:8px; }
    .brand-logo h1 span { color:#c9a82c; font-weight:900; font-size:2.4rem; }
    .brand-logo .dot { width:7px; height:7px; background:#c9a82c; border-radius:50%; margin:0 4px; animation:dotPulse 2s infinite; }
    @keyframes dotPulse { 0%,100%{opacity:0.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }
    .nav-float { position:fixed; top:20px; right:24px; z-index:1001; display:flex; flex-direction:column; align-items:flex-end; }
    .nav-trigger { background:rgba(255,255,255,0.78); backdrop-filter:blur(22px); border:1.5px solid rgba(201,168,44,0.35); color:#3a3f4c; width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.3s; }
    .nav-trigger:hover { background:#c9a82c; border-color:#c9a82c; color:#fff; }
    .nav-menu { margin-top:10px; background:rgba(255,255,255,0.92); backdrop-filter:blur(30px); border-radius:24px; padding:8px; border:1.5px solid rgba(201,168,44,0.25); display:flex; flex-direction:column; gap:2px; min-width:170px; opacity:0; visibility:hidden; transform:translateY(8px); transition:0.3s; }
    .nav-menu.active { opacity:1; visibility:visible; transform:translateY(0); }
    .nav-menu a { color:#3a3f4c; text-decoration:none; font-weight:500; font-size:0.88rem; padding:12px 18px; border-radius:16px; display:flex; align-items:center; gap:10px; }
    .nav-menu a:hover { background:rgba(201,168,44,0.08); color:#c9a82c; transform:translateX(6px); }
    .hero-banner { width:100%; height:45vh; background:linear-gradient(0deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=1920&auto=format&fit=crop'); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; animation:fadeUp 1s; }
    @keyframes fadeUp { 0%{opacity:0;transform:translateY(30px)} 100%{opacity:1;transform:translateY(0)} }
    .hero-banner h1 { font-size:3.5rem; color:#fff; }

    .timeline { max-width:1000px; margin:60px auto; padding:0 20px; position:relative; }
    .step { display:flex; align-items:center; margin-bottom:80px; opacity:0; transform:translateX(-30px); transition:0.8s; }
    .step:nth-child(even) { flex-direction:row-reverse; transform:translateX(30px); }
    .step.visible { opacity:1; transform:translateX(0); }
    .step-img { flex:1; height:250px; border-radius:30px; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.1); }
    .step-img img { width:100%; height:100%; object-fit:cover; transition:0.5s; }
    .step-img:hover img { transform:scale(1.1); }
    .step-text { flex:1; padding:30px; }
    .step-text h2 { font-size:2rem; color:#c9a82c; }
    .footer { background:#f0f2f5; color:#6b7280; text-align:center; padding:40px 20px; border-top:1px solid #e0e3e8; }
    .footer-social { margin-bottom:16px; display:flex; justify-content:center; gap:30px; }
    .footer-social a { color:#4a4f5c; text-decoration:none; font-weight:500; display:flex; align-items:center; gap:8px; }
    .footer-social a:hover { color:#c9a82c; }
  </style>
</head>
<body>
  <a href="index.html" style="text-decoration:none; color:inherit;"><div class="brand-logo"><h1><span>The Top Market</span><span class="dot"></span></h1></div></a>

    <div class="nav-menu" id="navMenu">

      <a href="team.html"><span class="dot"></span> 計劃流程</a>
      <a href="faq.html"><span class="dot"></span> 常見問題</a>
      <a href="contact.html"><span class="dot"></span> 聯絡我們</a>
    </div>
  </div>
  <div class="hero-banner"><h1>計劃流程</h1></div>
  <div class="timeline">
    <div class="step"><div class="step-img"><img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?q=80&w=600"></div><div class="step-text"><h2>01 初步諮詢</h2><p>了解需求，評估可行性，提供初步建議。</p></div></div>
    <div class="step"><div class="step-img"><img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=600"></div><div class="step-text"><h2>02 數據分析</h2><p>市場調研，收集行業數據，深入分析。</p></div></div>
    <div class="step"><div class="step-img"><img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=600"></div><div class="step-text"><h2>03 策略制定</h2><p>量身定制方案，確保可執行性。</p></div></div>

      <a href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M8.5 11a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-7.76 5.27c-.47-.27-.74-.68-.74-1.13 0-.45.27-.86.74-1.13C7.13 13.27 8.5 12.5 12 12.5s4.87.77 6.26 1.51c.47.27.74.68.74 1.13 0 .45-.27.86-.74 1.13-1.39.74-3.76 1.51-6.26 1.51s-4.87-.77-6.26-1.51zM12 2C6.48 2 2 6.48 2 12c0 2.07.63 4 1.7 5.59L2.5 22l4.62-1.29c1.42.82 3.05 1.29 4.88 1.29 5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg> WeChat</a>

      <a href="#"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4c0 3.2-2.6 5.8-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2z"/></svg> Instagram</a>
    </div>
    <p>© 2026 銳鋒有限公司 Top Market HK Limited</p>
  </div>
  <script>
    const trigger=document.getElementById('navTrigger'), menu=document.getElementById('navMenu');
    function toggle(e){ e.stopPropagation(); trigger.classList.toggle('active'); menu.classList.toggle('active'); }
    trigger.addEventListener('click',toggle);
    document.addEventListener('click',e=>{ if(!trigger.contains(e.target)&&!menu.contains(e.target)){ trigger.classList.remove('active'); menu.classList.remove('active'); } });
    trigger.addEventListener('mouseenter',()=>{ if(window.innerWidth>768){ trigger.classList.add('active'); menu.classList.add('active'); } });
    menu.addEventListener('mouseleave',()=>{ if(window.innerWidth>768){ trigger.classList.remove('active'); menu.classList.remove('active'); } });
    menu.querySelectorAll('a').forEach(l=>l.addEventListener('click',()=>{ trigger.classList.remove('active'); menu.classList.remove('active'); }));
    const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if(entry.isIntersecting) { entry.target.classList.add('visible'); } }); }, { threshold:0.3 });
    document.querySelectorAll('.step').forEach(el => observer.observe(el));
  </script>
</body>
</html>
